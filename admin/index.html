<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Ngopa Ngopi Ae</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://aenpbsmaazkebxfkbwid.supabase.co'
        const supabaseKey = 'sb_publishable_Zcka6Mi0CzlFLrIYGlQdMg_GKLBiHlz'
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey)
    </script>
    <style>
        /* ========== BACKGROUND BODY ========== */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #eef2f7; 
            color: #1a1a1a; 
            min-height: 100vh; 
            padding: 16px; 
        }
        
        /* ========== CARD ORDER ========== */
        .admin-card { 
            background: #ffffff; 
            border: 1px solid #e5e7eb; 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
        }
        .admin-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        /* ========== ITEM CHIP ========== */
        .item-chip {
            display: inline-block;
            background: #f3f4f6;
            padding: 2px 10px;
            border-radius: 6px;
            margin: 2px 4px 2px 0;
            font-size: 12px;
            color: #1a1a1a;
            border: 1px solid #e5e7eb;
        }
        .item-chip .note {
            color: #b45309;
            font-style: italic;
        }
        .item-chip .price {
            color: #2E6F40;
            font-weight: 600;
        }
        
        /* ========== LOCK SCREEN ========== */
        .admin-lock { 
            background: #ffffff; 
            border: 2px solid #2E6F40; 
            border-radius: 20px; 
            padding: 30px; 
            text-align: center; 
            max-width: 400px; 
            margin: 80px auto 0; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .admin-lock input { 
            width: 100%; 
            padding: 14px; 
            background: #f3f4f6; 
            border: 1px solid #d1d5db; 
            border-radius: 12px; 
            color: #1a1a1a; 
            text-align: center; 
            font-size: 16px; 
            outline: none; 
        }
        .admin-lock input:focus { border-color: #2E6F40; }
        .admin-lock h2 { color: #1a1a1a; }
        .admin-lock p { color: #6b7280; }
        
        /* ========== BADGE STATUS ========== */
        .admin-badge-diterima { background: #3B82F6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
        .admin-badge-diproses { background: #F59E0B; color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
        .admin-badge-siap { background: #10B981; color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
        .admin-badge-selesai { background: #6B7280; color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
        
        /* ========== SELECT STATUS ========== */
        .admin-status-select { 
            background: #ffffff; 
            color: #1a1a1a; 
            border: 1px solid #d1d5db; 
            padding: 4px 8px; 
            border-radius: 8px; 
            font-size: 11px; 
            cursor: pointer; 
        }
        
        /* ========== BUTTON ========== */
        .btn-primary { 
            background: #2E6F40; 
            color: #ffffff; 
            font-weight: 900; 
            padding: 12px 24px; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
            width: 100%; 
        }
        .btn-primary:hover { background: #1B4326; }
        
        .back-btn { 
            background: #2E6F40; 
            color: #ffffff; 
            padding: 8px 20px; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .back-btn:hover { background: #1B4326; }
        
        .refresh-btn { 
            background: #2E6F40; 
            color: white; 
            padding: 6px 16px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
        }
        .refresh-btn:hover { background: #1B4326; }
        
        /* ========== UTILITY ========== */
        .max-w-3xl { max-width: 48rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .loading { text-align: center; color: #6b7280; padding: 20px; }
        .empty { text-align: center; color: #6b7280; padding: 20px; }
        .error-text { text-align: center; color: #ef4444; padding: 20px; }
        
        /* ========== HEADER ========== */
        .header-title { color: #1a1a1a; }
        .header-sub { color: #6b7280; }
        
        /* ========== TEXT COLOR IN CARD ========== */
        .admin-card .order-code { color: #2E6F40; font-weight: 900; }
        .admin-card .order-date { color: #6b7280; }
        .admin-card .customer-name { color: #1a1a1a; font-weight: bold; }
        .admin-card .customer-phone { color: #6b7280; }
        .admin-card .items-text { color: #4b5563; }
        .admin-card .total-price { color: #2E6F40; font-weight: 900; font-size: 16px; }
        .admin-card .brand-tag { color: #b45309; }
        .admin-card .border-divider { border-color: #e5e7eb; }
    </style>
</head>
<body>
    <div class="max-w-3xl mx-auto">

        <!-- ========== HEADER ========== -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <img src="logo-ngopa-ngopi-ae.png" alt="Logo" class="h-10 w-auto" />
                <div>
                    <h1 class="text-xl font-black text-brand-900">Admin Panel</h1>
                    <p class="text-xs text-gray-500">Kelola pesanan customer</p>
                </div>
            </div>
            <button onclick="window.location.href='/'" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </button>
        </div>

        <!-- ========== LOCK SCREEN ========== -->
        <div id="adminLock" class="admin-lock">
            <i class="fa-solid fa-lock text-amber-500 text-5xl mb-3"></i>
            <h2 class="text-2xl font-black text-gray-900">🔐 Admin Only</h2>
            <p class="text-sm text-gray-500 mb-4">Masukkan password untuk mengelola order</p>
            <input type="password" id="adminPasswordInput" placeholder="Masukkan password..." onkeypress="if(event.key==='Enter') unlockAdmin()">
            <button onclick="unlockAdmin()" class="btn-primary" style="margin-top:12px;">
                <i class="fa-solid fa-key"></i> Buka Dashboard
            </button>
        </div>

        <!-- ========== DASHBOARD ========== -->
        <div id="adminDashboard" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 class="text-xl font-black text-gray-900">📋 Daftar Pesanan</h2>
                <button onclick="loadAdminOrders()" class="refresh-btn">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>
            <div id="adminOrderList"></div>
        </div>

    </div>

    <script>
        // ==================== PASSWORD ====================
        const ADMIN_PASSWORD = 'rahasia123';

        // ==================== UNLOCK ====================
        function unlockAdmin() {
            const pass = document.getElementById('adminPasswordInput').value.trim();
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('adminLock').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminOrders();
            } else {
                alert('❌ Password salah!');
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPasswordInput').focus();
            }
        }

        document.getElementById('adminPasswordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') unlockAdmin();
        });

        // ==================== LOAD ORDERS ====================
        async function loadAdminOrders() {
            const container = document.getElementById('adminOrderList');
            container.innerHTML = '<div class="loading">Memuat data...</div>';

            try {
                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!orders || orders.length === 0) {
                    container.innerHTML = '<div class="empty">Belum ada pesanan.</div>';
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const statusClass = (order.status || 'Pesanan Diterima').toLowerCase().replace(/\s/g, '');
                    const date = new Date(order.created_at).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
                    const orderCode = order.order_code || `NGOP-${new Date(order.created_at).getFullYear()}${String(new Date(order.created_at).getMonth()+1).padStart(2,'0')}-${String(order.id).padStart(4,'0')}`;
                    
                    let totalItems = 0;
                    let itemsHtml = '';
                    let brands = [];
                    if (order.items && Array.isArray(order.items)) {
                        totalItems = order.items.length;
                        itemsHtml = order.items.map(item => {
                            if (item.brand) brands.push(item.brand);
                            const noteHtml = item.note ? ` <span class="note">(${item.note})</span>` : '';
                            return `<span class="item-chip">${item.name} ${item.size ? `(${item.size})` : ''}${noteHtml}</span>`;
                        }).join(' ');
                    }
                    const uniqueBrands = [...new Set(brands)];

                    return `
                        <div class="admin-card">
                            <div style="display:flex; justify-content:space-between; align-items:start;">
                                <div>
                                    <span class="order-code text-sm">${orderCode}</span>
                                    <span class="order-date text-xs ml-2">${date}</span>
                                    ${uniqueBrands.length > 0 ? `<span class="brand-tag text-xs ml-2 font-bold">${uniqueBrands.join(', ')}</span>` : ''}
                                </div>
                                <span class="admin-badge-${statusClass}">${order.status || 'Pesanan Diterima'}</span>
                            </div>
                            <div style="margin-top:6px;">
                                <span class="customer-name text-sm">${order.customer_name}</span>
                                <span class="customer-phone text-xs ml-2">${order.customer_phone}</span>
                            </div>
                            <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">
                                ${itemsHtml || '<span class="text-gray-400 text-xs">Tidak ada item</span>'}
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid #e5e7eb;">
                                <span class="total-price">Rp${Number(order.total_price).toLocaleString('id-ID')}</span>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span style="font-size:10px; color:#6b7280;">${totalItems} item</span>
                                    <select class="admin-status-select" onchange="updateOrderStatus('${order.id}', this.value)">
                                        <option value="Pesanan Diterima" ${order.status === 'Pesanan Diterima' ? 'selected' : ''}>Diterima</option>
                                        <option value="Sedang Diproses" ${order.status === 'Sedang Diproses' ? 'selected' : ''}>Diproses</option>
                                        <option value="Siap Diambil/Diantar" ${order.status === 'Siap Diambil/Diantar' ? 'selected' : ''}>Siap</option>
                                        <option value="Selesai" ${order.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error:', err);
                container.innerHTML = '<div class="error-text">❌ Gagal memuat data. Coba refresh.</div>';
            }
        }

        // ==================== UPDATE STATUS ====================
        async function updateOrderStatus(orderId, newStatus) {
            if (!confirm(`Ubah status order #${orderId} menjadi "${newStatus}"?`)) {
                loadAdminOrders();
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', orderId);

                if (error) {
                    alert('❌ Gagal update: ' + error.message);
                    console.error(error);
                } else {
                    alert('✅ Status berhasil diperbarui!');
                    loadAdminOrders();
                }
            } catch (err) {
                alert('❌ Gagal terhubung ke database!');
                console.error(err);
            }
        }
    </script>
</body>
</html>
